<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stitched By Trae</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <h1>💜 Welcome Back</h1>
        <p>Log in to your Stitched By Trae account.</p>

        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <div class="password-field">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
                <button type="button" class="show-password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">Show</button>
            </div>

            <label class="remember-login">
                <input
                    type="checkbox"
                    id="rememberMe"
                >
                Remember Me
            </label>

            <button type="submit" class="button">
                Login
            </button>

            <p>
                <a href="forgot-password.html">Forgot your password?</a>
            </p>

        </form>

        <p id="login-message"></p>

        <p>
            Don't have an account?
            <a href="signup.html">Create One</a>
        </p>

        <p>
            <a href="index.html" class="continue-guest">Continue without logging in</a>
        </p>

    </div>
</div>

<script>
function togglePassword(btn) {
    const input = btn.previousElementSibling;
    const isShowing = input.type === 'text';
    input.type = isShowing ? 'password' : 'text';
    btn.textContent = isShowing ? 'Show' : 'Hide';
}

const params = new URLSearchParams(window.location.search);
const msg = document.getElementById('login-message');
if (params.get('verified') === '1') {
    msg.style.color = '#5a3e6b';
    msg.textContent = 'Email verified! You can now log in.';
} else if (params.get('error') === 'invalid') {
    msg.style.color = 'red';
    msg.textContent = 'That verification link is invalid or has already been used.';
}

document.getElementById('login-form')
.addEventListener('submit', async (e) => {

    e.preventDefault();

    const response = await fetch('/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            rememberMe:
                document.getElementById('rememberMe').checked
        })
    });

    const data = await response.json();

    if (data.success) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('login-message')
            .textContent = data.error;
    }
});
</script>

</body>
</html>
