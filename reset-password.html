<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Stitched By Trae</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <h1>🔒 Create New Password</h1>
        <p>Enter and confirm your new password below.</p>

        <form id="reset-form">

            <div class="password-field">
                <input type="password" id="password" placeholder="New Password" required autocomplete="new-password">
                <button type="button" class="show-password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">Show</button>
            </div>

            <ul class="pw-rules" id="pw-rules">
                <li id="rule-len">At least 8 characters</li>
                <li id="rule-upper">One uppercase letter (A–Z)</li>
                <li id="rule-lower">One lowercase letter (a–z)</li>
                <li id="rule-number">One number (0–9)</li>
                <li id="rule-special">One special character (!@#$%...)</li>
            </ul>

            <div class="password-field">
                <input type="password" id="confirm-password" placeholder="Confirm New Password" required autocomplete="new-password">
                <button type="button" class="show-password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">Show</button>
            </div>

            <button type="submit" class="button">Update Password</button>

        </form>

        <p id="message"></p>

        <p><a href="/login">Back to Login</a></p>

    </div>
</div>

<script>
function togglePassword(btn) {
    const input = btn.closest('.password-field').querySelector('input');
    const isShowing = input.type === 'text';
    input.type = isShowing ? 'password' : 'text';
    btn.textContent = isShowing ? 'Show' : 'Hide';
}

const passwordRules = [
    { id: 'rule-len',     test: p => p.length >= 8 },
    { id: 'rule-upper',   test: p => /[A-Z]/.test(p) },
    { id: 'rule-lower',   test: p => /[a-z]/.test(p) },
    { id: 'rule-number',  test: p => /[0-9]/.test(p) },
    { id: 'rule-special', test: p => /[^A-Za-z0-9]/.test(p) },
];

function checkPasswordStrength(password) {
    passwordRules.forEach(rule => {
        document.getElementById(rule.id).classList.toggle('met', rule.test(password));
    });
}

function isPasswordValid(password) {
    return passwordRules.every(rule => rule.test(password));
}

document.getElementById('password').addEventListener('input', e => {
    checkPasswordStrength(e.target.value);
});

document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const msg = document.getElementById('message');

    if (!isPasswordValid(password)) {
        msg.style.color = 'red';
        msg.textContent = 'Please meet all password requirements before continuing.';
        return;
    }

    if (password !== confirmPassword) {
        msg.style.color = 'red';
        msg.textContent = 'Passwords do not match.';
        return;
    }

    const token = new URLSearchParams(window.location.search).get('token');

    const response = await fetch('/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
    });

    const data = await response.json();

    if (data.message) {
        msg.style.color = '#5a3e6b';
        msg.textContent = data.message;
        document.getElementById('reset-form').style.display = 'none';
    } else {
        msg.style.color = 'red';
        msg.textContent = data.error || 'Something went wrong. Please try again.';
    }
});
</script>

</body>
</html>
