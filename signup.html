<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Stitched By Trae</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <h1>🧶 Create Account</h1>
        <p>Create an account to save your information and checkout faster.</p>

        <form id="signup-form">

            <div class="name-fields">
                <input
                    type="text"
                    id="first-name"
                    placeholder="First Name"
                    required
                >
                <input
                    type="text"
                    id="last-name"
                    placeholder="Last Name"
                    required
                >
            </div>

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <div class="password-field">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
                <button type="button" class="show-password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">Show</button>
            </div>

            <div class="password-field">
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm Password"
                    required
                >
                <button type="button" class="show-password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">Show</button>
            </div>

            <button type="submit" class="button">
                Create Account
            </button>

        </form>

        <p id="signup-message"></p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p>
            <a href="index.html" class="continue-guest">Continue without logging in</a>
        </p>

    </div>
</div>

<script>
function togglePassword(btn) {
    const input = btn.closest('.password-field').querySelector('input');
    const isShowing = input.type === 'text';
    input.type = isShowing ? 'password' : 'text';
    btn.textContent = isShowing ? 'Show' : 'Hide';
}

document.getElementById('signup-form')
.addEventListener('submit', async (e) => {

    e.preventDefault();

    const password =
        document.getElementById('password').value;

    const confirmPassword =
        document.getElementById('confirm-password').value;

    if (password !== confirmPassword) {
        document.getElementById('signup-message')
            .textContent = 'Passwords do not match.';
        return;
    }

    const response = await fetch('/signup', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            name: document.getElementById('first-name').value.trim() + ' ' + document.getElementById('last-name').value.trim(),
            email: document.getElementById('email').value,
            password
        })
    });

    const data = await response.json();

    if (data.success) {
        document.getElementById('signup-message').style.color = '#5a3e6b';
        document.getElementById('signup-message').textContent = data.message;
        document.getElementById('signup-form').style.display = 'none';
    } else {
        document.getElementById('signup-message').style.color = 'red';
        document.getElementById('signup-message').textContent = data.error;
    }
});
</script>

</body>
</html>
