<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Stitched By Trae</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

<header>
    <nav class="nav-bar">
        <div class="nav-brand">
            <span class="logo">🧶</span>
            <h1>Stitched By Trae</h1>
        </div>
        <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/#shop">Shop</a></li>
            <li><a href="/account">My Account</a></li>
            <li class="cart-nav-item">
                <a href="/checkout" class="cart-nav-link">🛒<span id="cart-badge" class="cart-badge"></span></a>
            </li>
        </ul>
    </nav>
</header>

<div class="account-hero">
    <div class="account-hero-content">
        <h2 id="welcome-heading">My Account</h2>
        <p id="hero-email"></p>
    </div>
</div>

<main class="account-body">

    <div class="account-info-card">
        <div class="account-info-details">
            <div class="account-avatar">
                <span id="avatar-initial">?</span>
            </div>
            <div class="account-info-text">
                <p class="account-name" id="user-name"></p>
                <p class="account-email" id="user-email"></p>
            </div>
        </div>
        <button class="account-logout-btn" id="logout-btn">Log Out</button>
    </div>

    <section class="account-orders">
        <h3>Order History</h3>
        <div id="order-history">
            <p class="account-loading">Loading orders...</p>
        </div>
    </section>

</main>

<footer>
    <p>© 2026 Stitched By Trae. Handmade with ❤️</p>
</footer>

<script src="site.js"></script>
<script>
function getItemColorLabels(product, bucketHatStyle) {
    if (product === 'Ruffle Bucket Hat') {
        return bucketHatStyle === 'main-rest'
            ? ['Main Color', 'Rest of Hat']
            : ['Main Color', 'Outer Color', 'Top Color'];
    }
    return ['Color'];
}

async function loadUser() {
    const res = await fetch('/me');
    const data = await res.json();

    if (!data.loggedIn) {
        window.location.href = '/login';
        return;
    }

    const name = data.user.name || '';
    const email = data.user.email || '';
    const firstName = name.split(' ')[0];

    document.getElementById('welcome-heading').textContent = `Welcome back, ${firstName}!`;
    document.getElementById('hero-email').textContent = email;
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-email').textContent = email;
    document.getElementById('avatar-initial').textContent = name.charAt(0).toUpperCase();

    const ordersRes = await fetch('/my-orders');
    const orders = await ordersRes.json();
    const orderHistory = document.getElementById('order-history');

    if (!orders.length) {
        orderHistory.innerHTML = `
            <div class="account-no-orders">
                <p>You haven't placed any orders yet.</p>
                <a href="/#shop" class="button">Shop Now</a>
            </div>
        `;
        return;
    }

    orderHistory.innerHTML = orders.map(order => {
        const items = JSON.parse(order.items || '[]');
        const date = new Date(order.created_at).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
        });
        const statusMap = {
            confirmed: { label: 'Confirmed', cls: 'status-confirmed' },
            shipped:   { label: 'Shipped',   cls: 'status-shipped'   },
            payment_pending: { label: 'Payment Pending', cls: 'status-pending' },
        };
        const { label, cls } = statusMap[order.status] || { label: order.status, cls: '' };

        const itemsHtml = items.map(item => {
            const colorLabels = getItemColorLabels(item.product, item.bucketHatStyle);
            const colorStr = (item.colors || []).map((c, i) => `${colorLabels[i] || 'Color'}: ${c}`).join(', ');
            const details = [
                colorStr,
                item.size || (item.headCircumference ? `Head: ${item.headCircumference}"` : ''),
                item.rowCount > 1 ? `Rows: ${item.rowCount}` : ''
            ].filter(Boolean).join(' · ');
            return `
            <div class="account-order-item">
                <span class="account-order-item-name">${item.product}</span>
                <span class="account-order-item-meta">${details}</span>
            </div>
        `}).join('');

        return `
            <div class="account-order-card">
                <div class="account-order-header">
                    <div>
                        <p class="account-order-number">${order.order_number}</p>
                        <p class="account-order-date">${date}</p>
                    </div>
                    <span class="order-status-badge ${cls}">${label}</span>
                </div>
                <div class="account-order-items">${itemsHtml}</div>
                ${order.tracking_number ? `
                    <div class="account-tracking">
                        📦 Tracking: <strong>${order.tracking_number}</strong>
                    </div>
                ` : ''}
                <div class="account-order-footer">
                    <span>Total</span>
                    <strong>$${order.total}</strong>
                </div>
            </div>
        `;
    }).join('');
}

document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/';
});

loadUser();
</script>

</body>
</html>
