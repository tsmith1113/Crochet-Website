<!DOCTYPE html>
<html>
<head>
    <title>My Account</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

<h1>My Account</h1>

<p id="user-name"></p>
<p id="user-email"></p>

<h2>My Orders</h2>

<div id="order-history">
    Loading orders...
</div>

<button id="logout-btn">
    Logout
</button>

<script>
document.getElementById('logout-btn')
.addEventListener('click', async () => {

    await fetch('/logout', {
        method: 'POST'
    });

    window.location.href = '/';
});
</script>

<script>
async function loadUser() {
    const response = await fetch('/me');
    const data = await response.json();

    if (!data.loggedIn) {
        window.location.href = '/login';
        return;
    }

    document.getElementById('user-name')
        .textContent = data.user.name;

    document.getElementById('user-email')
        .textContent = data.user.email;

    const ordersResponse = await fetch('/my-orders');
    const orders = await ordersResponse.json();

    const orderHistory =
        document.getElementById('order-history');

    if (!orders.length) {
        orderHistory.innerHTML =
            '<p>No orders yet.</p>';
    } else {
        orderHistory.innerHTML = orders.map(order => {

    const items = JSON.parse(order.items || '[]');

    const itemHtml = items.map(item => `
        <div class="order-item">
            <strong>${item.product}</strong>
            <p>Colors: ${item.colors?.join(', ') || 'N/A'}</p>
            <p>${item.size || item.headCircumference || ''}</p>
        </div>
    `).join('');

    return `
        <div class="order-card">
            <h3>${order.order_number}</h3>

            <p>Status: ${order.status}</p>

            ${itemHtml}

            <p><strong>Total:</strong> $${order.total}</p>

            <p>
                ${new Date(order.created_at)
                    .toLocaleDateString()}
            </p>
        </div>
    `;
}).join('');
    }
}

loadUser();
</script>

</body>
</html>
