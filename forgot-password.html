<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Stitched By Trae</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <h1>🔑 Reset Password</h1>

        <p>
            Enter your email address and we'll send you a password reset link.
        </p>

        <form id="forgot-form">
            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <button type="submit" id="reset-btn" class="button">
                Send Reset Link
            </button>
        </form>

        <p id="message"></p>

        <p>
            <a href="/login">Back to Login</a>
        </p>

    </div>
</div>

<script>
document.getElementById('forgot-form')
.addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('reset-btn');
    const msg = document.getElementById('message');
    const email = document.getElementById('email').value;

    btn.disabled = true;
    btn.textContent = 'Sending...';
    msg.textContent = '';

    try {
        const response = await fetch('/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (data.error) {
            msg.style.color = 'red';
            msg.textContent = data.error;
            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
        } else {
            msg.style.color = '#5a3e6b';
            msg.textContent = data.message || 'If an account exists, a reset email has been sent.';
            document.getElementById('forgot-form').style.display = 'none';
        }
    } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Something went wrong. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
    }
});
</script>

</body>
</html>
